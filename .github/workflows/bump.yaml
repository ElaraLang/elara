name: Maintain upper bounds
on:
  workflow_dispatch:
  schedule:
    - cron: "45 6 * * 6"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: bump
  cancel-in-progress: true
jobs:
  bump-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
        name: Install Nix
        with:
          extra-conf: |
            trusted-public-keys = elara.cachix.org-1:d129AMaRCJ6Q86oVUvIccZ1NsRZ6kyL5IkceevfQDWI= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            substituters = https://elara.cachix.org https://cache.nixos.org/
            accept-flake-config = true
      - uses: ryanccn/attic-action@v0
        with:
          endpoint: https://cache.bristermitten.me/
          cache: elara
          token: ${{ secrets.ATTIC_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: elara
          installCommand: nix profile add github:NixOS/nixpkgs/nixpkgs-unstable#cachix
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - id: bounds
        name: Bump upper bounds
        run: nix run .#bump -- --output=ga-pr --build-timeout=3600
      - name: Create pull request
        if: steps.bounds.outputs.commit-message
        uses: peter-evans/create-pull-request@v8
        with:
          branch: hix-managed/bump
          commit-message: ${{ steps.bounds.outputs.commit-message }}
          title: ${{ steps.bounds.outputs.title }}
          body: ${{ steps.bounds.outputs.body }}
          committer: ${{ steps.bounds.outputs.committer }}
          signoff: ${{ steps.bounds.outputs.signoff }}
          delete-branch: ${{ steps.bounds.outputs.delete-branch }}
