name: "CI"
on:
  push:
    branches:
      - "*"
  pull_request:
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: wimpysworld/nothing-but-nix@main
      - uses: DeterminateSystems/nix-installer-action@main
        name: Install Nix
        with:
          extra-conf: |
            trusted-public-keys = elara.cachix.org-1:d129AMaRCJ6Q86oVUvIccZ1NsRZ6kyL5IkceevfQDWI= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            substituters = https://elara.cachix.org https://cache.nixos.org/
            accept-flake-config = true
      - uses: ryanccn/attic-action@v0
        with:
          endpoint: https://cache.bristermitten.me/
          cache: elara
          token: ${{ secrets.ATTIC_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: elara
          installCommand: nix profile add github:NixOS/nixpkgs/nixpkgs-unstable#cachix
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: nix flake check
  devshell-macos:
    runs-on: macos-latest
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
        name: Install Nix
        with:
          extra-conf: |
            trusted-public-keys = elara.cachix.org-1:d129AMaRCJ6Q86oVUvIccZ1NsRZ6kyL5IkceevfQDWI= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            substituters = https://elara.cachix.org https://cache.nixos.org/
            accept-flake-config = true
      - uses: ryanccn/attic-action@v0
        with:
          endpoint: https://cache.bristermitten.me/
          cache: elara
          token: ${{ secrets.ATTIC_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: elara
          installCommand: nix profile add github:NixOS/nixpkgs/nixpkgs-unstable#cachix
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: nix develop --profile dev-profile -c true
      - run: cachix push elara dev-profile
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
