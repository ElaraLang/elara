name: "Dev build"
on:
  push:
    branches:
      - "main"
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # `package` is the flake package that produces the binary
          - os: ubuntu-latest
            arch: x86_64-linux
            package: elara-static
          - os: ubuntu-24.04-arm
            arch: aarch64-linux
            package: elara-static
          - os: macos-latest
            arch: aarch64-darwin
            package: elara-portable
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write # lets cache-nix-action purge superseded store caches
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Free disk space for the Nix store
        if: runner.os == 'Linux' || runner.os == 'macOS'
        uses: wimpysworld/nothing-but-nix@main
      - name: Install Nix
        uses: cachix/install-nix-action@v32
        with:
          # keep-outputs/keep-derivations stop the cache's GC from deleting the build-time closure containing GHC etc.
          extra_nix_config: |
            accept-flake-config = true
            keep-outputs = true
            keep-derivations = true
      # Restoring a cached /nix/store is much faster than pulling GHC and the libraries from attic on every run.
      - name: Restore nix store cache
        uses: nix-community/cache-nix-action@v7
        with:
          # Only key on the nix config so other changes don't invalidate cache
          primary-key: nix-${{ matrix.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**') }}
          restore-prefixes-first-match: nix-${{ matrix.arch }}-
          gc-max-store-size: 8G
          # replace superseded caches for this arch, but never the one that was just restored or saved
          purge: true
          purge-prefixes: nix-${{ matrix.arch }}-
          purge-created: 0
          purge-primary-key: never
      # Set up after the cache restore, so that attic only receives what this run built
      - name: Set up attic
        uses: ryanccn/attic-action@v0
        with:
          endpoint: https://cache.bristermitten.me/
          cache: elara
          token: ${{ secrets.ATTIC_TOKEN }}
      - name: Build elara
        run: nix build ".#packages.${{ matrix.arch }}.${{ matrix.package }}" -L
      - name: Rename binary
        run: cp result/bin/elara elara-${{ matrix.arch }}
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: elara-${{ matrix.arch }}
          path: elara-${{ matrix.arch }}
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish rolling dev-build release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev-build
          name: "Dev build"
          prerelease: true
          body: |
            Automatically rebuilt from the latest `main` commit (${{ github.sha }}).
          files: artifacts/*
