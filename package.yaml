spec-version: 0.36.0
name: elara
version: 0.1.0
synopsis: See README for more info
description: See README for more info
author: Alexander Wood
maintainer: Alexander Wood <alexljwood24@hotmail.co.uk>
copyright: 2022 Alexander Wood
license: MIT
license-file: LICENSE
github: ElaraLang/elara
build-type: Simple
extra-source-files:
  - jvm-stdlib/**/*.java
  - stdlib/**/*.elr # embedded into the executable
language: GHC2024
default-extensions:
  - OverloadedStrings
  - OverloadedRecordDot
  - TypeFamilies
  - LambdaCase
  - ImportQualifiedPost
  - DeriveDataTypeable
  - DataKinds
  - DeriveFunctor
  - TypeApplications
  - PartialTypeSignatures
ghc-options:
  - -W
  - -Wno-name-shadowing
  - -Wno-partial-type-signatures
  - -Widentities
  - -optP-Wno-nonportable-include-path
  - -fno-show-valid-hole-fits
dependencies:
  - name: base
    version: ">=4.21.1.0 && <4.22"
    mixin: [hiding (Prelude)]
library:
  source-dirs: src
  build-tools:
    - alex:alex
  dependencies:
    - aeson >=2.2.3.0 && <2.4
    - algebraic-graphs >=0.0.1 && <0.9
    - array >=0.5.8.0 && <0.6
    - binary >=0.8.9.3 && <0.9
    - bytestring >=0.12.2.0 && <0.13
    - co-log-core >=0.3.2.6 && <0.4
    - containers ==0.7.*
    - dependent-hashmap >=0.1.0.0 && <0.2
    - dependent-sum-template >=0.2.0.2 && <0.3
    - diagnose >=1.8.2 && <2.7
    - directory >=1.3.9.0 && <1.4
    - effectful >=2.6.1.0 && <2.7
    - effectful-core >=2.6.1.0 && <2.7
    - effectful-th >=1.0.0.3 && <1.1
    - filepath >=1.5.4.0 && <1.6
    - generic-optics >=2.2.1.0 && <2.4
    - h2jvm >=0.1.0.0 && <0.2
    - hashable >=1.5.1.0 && <1.6
    - kind-generics-th >=0.2.3.3 && <0.3
    - lifted-base >=0.2.3.2 && <0.3
    - lsp >=2.8.0.0
    - lsp-types
    - matrix >=0.3.6.2 && <0.4
    - megaparsec >=9.5.0 && <9.8
    - mtl >=2.3.1 && <2.4
    - optics >=0.4.2.1 && <0.5
    - parser-combinators >=1.0.0 && <1.4
    - pretty-simple >=3.2.1.0 && <4.2
    - prettyprinter >=1.7.1 && <1.8
    - prettyprinter-ansi-terminal >=1.1.2 && <1.2
    - process >=1.6.26.1 && <1.7
    - relude >=1.2.2.0 && <1.3
    - safe-exceptions >=0.1.7.4 && <0.2
    - some >=1.0.6 && <1.1
    - stringsearch >=0.3.6.6 && <0.4
    - template-haskell >=2.23.0.0 && <2.24
    - text-metrics >=0.3.2 && <0.4
    - th-abstraction >=0.7.2.0 && <0.8
    - time ==1.14.*
    - utf8-string >=0.3.7 && <1.1
    - witch >=1.3.1.0 && <1.4
  when:
    - condition: "!arch(wasm32)"
      # no terminal on wasm
      dependencies:
        - terminal-size >=0.3.0 && <0.4
executables:
  elara:
    main: Main.hs
    source-dirs: app
    generated-other-modules: [Paths_elara]
    dependencies:
      - elara
      - autodocodec >=0.4.0.0 && <0.8
      - containers
      - diagnose
      - effectful
      - effectful-core
      - opt-env-conf >=0.5.0.0 && <0.18
      - relude
    when:
      # wasm has no threaded RTS
      - condition: "!arch(wasm32)"
        ghc-options: [-threaded, -rtsopts, -with-rtsopts=-N]
tests:
  elara-test:
    main: Spec.hs
    source-dirs: test
    default-extensions: [QuasiQuotes]
    dependencies:
      - elara
      - bytestring
      - co-log-core
      - containers
      - dependent-hashmap
      - diagnose
      - effectful
      - effectful-core
      - filepath
      - h2jvm
      - hedgehog >=1.5 && <1.8
      - lsp
      - lsp-types
      - megaparsec
      - neat-interpolation >=0.5.1.4 && <0.6
      - prettyprinter
      - prettyprinter-ansi-terminal
      - process
      - relude
      - sydtest >=0.18.0.0 && <0.34
      - sydtest-hedgehog >=0.4.0.0 && <0.5
      - template-haskell
      - text
    when:
      # wasm has no threaded RTS
      - condition: "!arch(wasm32)"
        ghc-options: [-threaded, -rtsopts, -with-rtsopts=-N]
